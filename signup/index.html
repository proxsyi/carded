<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carded — Sign Up</title>
    <meta name="description" content="Create your Carded account and sync your flashcards everywhere.">
    <meta name="theme-color" content="#1e1e2e">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/carded/assets/favicon.png">
    <link rel="apple-touch-icon" href="/carded/assets/apple-touch-icon.png">
    <link rel="manifest" href="/carded/manifest.webmanifest">

    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="/carded/styles.css?v=4.0.0">
    <script src="https://js.sentry-cdn.com/db8a21f989f91cec2aed1dd0fa6c04a0.min.js" crossorigin="anonymous"></script>
    <script>
      window.sentryOnLoad = function() {
        Sentry.init({
          dsn: "https://db8a21f989f91cec2aed1dd0fa6c04a0@o4511180207554560.ingest.us.sentry.io/4511180213977088",
          sendDefaultPii: true,
        });
      };
    </script>
    <script src="/carded/theme.js?v=4.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.101.1" integrity="sha384-0VpB0wAYDdhWCEv3+IjT0Z9Kgpvszkf70RFX3ro7l4QR5nywxsMaOpmvZKsfRF8I" crossorigin="anonymous" defer></script>
    <script src="/carded/config.js?v=4.0.0" defer></script>
    <script src="/carded/utils.js?v=4.0.0" defer></script>
    <script src="/carded/auth-guard.js?v=4.0.0" defer></script>
    <script src="/carded/auth.js?v=4.0.0" defer></script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>
    <noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1e1e2e;color:#e8e8ed;font-family:system-ui,sans-serif;text-align:center;padding:24px">Carded requires JavaScript. Please enable JavaScript in your browser.</div></noscript>
    <main class="auth-shell" id="main">
      <section class="auth-card">
        <p class="eyebrow">Carded</p>
        <h1>Create your account</h1>
        <p class="auth-copy">Sync your library and keep studying offline.</p>

        <form id="signup-form" class="stack">
          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" class="input" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <div class="password-field">
              <input id="signup-password" name="password" class="input" type="password" autocomplete="new-password" required>
              <button class="ghost-button password-toggle" data-toggle-password="signup-password" type="button">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="signup-confirm-password">Confirm password</label>
            <div class="password-field">
              <input id="signup-confirm-password" name="confirmPassword" class="input" type="password" autocomplete="new-password" required>
              <button class="ghost-button password-toggle" data-toggle-password="signup-confirm-password" type="button">Show</button>
            </div>
          </div>
          <button class="button" type="submit">Create account</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <div class="stack">
          <button class="ghost-button auth-button oauth-google" data-oauth="google" type="button">
            <span class="oauth-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
            </span>
            <span>Sign up with Google</span>
          </button>
          <button class="ghost-button auth-button oauth-github" data-oauth="github" type="button">
            <span class="oauth-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 .1 1.6.7 2 1.3.3-.7.8-1.1 1.4-1.4-2.7-.3-5.6-1.4-5.6-6A4.7 4.7 0 0 1 4.6 9c-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.1 3.1a4.7 4.7 0 0 1 1.2 3.2c0 4.6-2.8 5.6-5.6 6 .4.3.8 1 .8 2v3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
            </span>
            <span>Sign up with GitHub</span>
          </button>
        </div>

        <div class="auth-footer">
          <p>Already have an account? <a href="/carded/login">Sign in</a></p>
        </div>
      </section>
    </main>
    <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
    <script defer>
      document.addEventListener("DOMContentLoaded", async function () {
        await window.CardedAuthGuard.guardPage({ requiresAuth: false });
        document.querySelectorAll("[data-toggle-password]").forEach(function (button) {
          button.addEventListener("click", function () {
            const input = document.getElementById(button.dataset.togglePassword);
            if (!input) return;
            input.type = input.type === "password" ? "text" : "password";
            button.textContent = input.type === "password" ? "Show" : "Hide";
          });
        });

        var hashParams = window.CardedAuthGuard.readHashParams();
        var searchParams = new URLSearchParams(window.location.search);
        var errorText = hashParams.get("error_description") || hashParams.get("error") || searchParams.get("error_description") || searchParams.get("error");
        if (errorText) {
          var errorMessage = errorText.toLowerCase().includes("google")
            ? "Google sign-in is temporarily limited. Try email or GitHub instead."
            : "Sign-in was cancelled. Please try again.";
          window.CardedAuth.showToast(errorMessage);
        }

        document.getElementById("signup-form").addEventListener("submit", async function (event) {
          event.preventDefault();
          const submitBtn = event.currentTarget.querySelector("[type='submit']");
          const data = new FormData(event.currentTarget);
          const password = String(data.get("password") || "");
          const confirmPassword = String(data.get("confirmPassword") || "");
          if (password.length < 6) {
            window.CardedAuth.showToast("Password must be at least 6 characters.");
            return;
          }
          if (password !== confirmPassword) {
            window.CardedAuth.showToast("Passwords do not match.");
            return;
          }
          window.CardedUtils.withLoading(submitBtn, async function () {
            try {
              const result = await window.CardedAuth.signUpWithEmail(String(data.get("email") || "").trim(), password);
              if (result && result.session) {
                window.CardedAuthGuard.redirectAuthedHome();
              } else {
                // Email confirmation required — session is null until user confirms
                window.CardedAuth.showToast("Check your email to confirm your account, then sign in.");
              }
            } catch (error) {
              window.CardedAuth.showToast(error.message || "Something went wrong. Please try again.");
            }
          });
        });

        document.querySelectorAll("[data-oauth]").forEach(function (button) {
          button.addEventListener("click", async function () {
            try {
              await window.CardedAuth.signInWithOAuth(button.dataset.oauth);
            } catch (error) {
              var message = button.dataset.oauth === "google"
                ? "Google sign-in is temporarily limited. Try email or GitHub instead."
                : "Sign-in was cancelled. Please try again.";
              window.CardedAuth.showToast(message);
            }
          });
        });
      });
    </script>
  </body>
</html>
