<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141417">
    <title>Sign Up · Carded</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./auth.js"></script>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Carded</p>
        <h1>Create your account</h1>
        <p class="auth-copy">Sync your library and keep studying offline.</p>

        <form id="signup-form" class="stack">
          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" class="input" type="email" autocomplete="email" required>
            <p id="signup-email-error" class="inline-error hidden">Enter a valid email address.</p>
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" class="input" type="password" autocomplete="new-password" required>
            <p id="signup-password-error" class="inline-error hidden">Password must be at least 6 characters.</p>
          </div>
          <button id="signup-submit" class="button" type="submit" disabled>Sign up</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <div class="stack">
          <button class="ghost-button auth-button" data-oauth="google" type="button">Sign up with Google</button>
          <button class="ghost-button auth-button" data-oauth="github" type="button">Sign up with GitHub</button>
        </div>

        <div class="auth-footer">
          <p>Already have an account? <a href="./signin.html">Sign in</a></p>
        </div>
      </section>
    </main>

    <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>

    <script>
      (function () {
        const auth = window.CardedAuth;
        const form = document.getElementById("signup-form");
        const emailInput = document.getElementById("signup-email");
        const passwordInput = document.getElementById("signup-password");
        const emailError = document.getElementById("signup-email-error");
        const passwordError = document.getElementById("signup-password-error");
        const submitButton = document.getElementById("signup-submit");

        function validateEmail(value) {
          return value.includes("@") && value.includes(".");
        }

        function validatePassword(value) {
          return value.length >= 6;
        }

        function updateValidationState() {
          const email = emailInput.value.trim();
          const password = passwordInput.value;
          const emailValid = validateEmail(email);
          const passwordValid = validatePassword(password);

          emailError.classList.toggle("hidden", !email || emailValid);
          passwordError.classList.toggle("hidden", !password || passwordValid);
          submitButton.disabled = !(email && password && emailValid && passwordValid);
        }

        function readOAuthError() {
          const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
          const params = new URLSearchParams(hash);
          const queryParams = new URLSearchParams(window.location.search);
          return params.get("error_description") || params.get("error") || queryParams.get("error_description") || queryParams.get("error");
        }

        window.addEventListener("DOMContentLoaded", async function () {
          const oauthError = readOAuthError();
          if (oauthError) {
            auth.showToast("Sign-in was cancelled. Please try again.");
          }

          const session = await auth.getSession().catch(() => null);
          if (session) {
            auth.redirectToIndex();
          }
        });

        emailInput.addEventListener("input", updateValidationState);
        passwordInput.addEventListener("input", updateValidationState);

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          updateValidationState();
          if (submitButton.disabled) return;

          const formData = new FormData(form);
          const email = String(formData.get("email") || "").trim();
          const password = String(formData.get("password") || "");

          try {
            await auth.signUpWithEmail(email, password);
          } catch (error) {
            if ((error.message || "").toLowerCase().includes("already")) {
              auth.showToast("An account with this email already exists. Try signing in.");
              return;
            }
            auth.showToast(error.message || "Something went wrong. Please try again.");
          }
        });

        document.querySelectorAll("[data-oauth]").forEach(function (button) {
          button.addEventListener("click", async function () {
            try {
              await auth.signInWithOAuth(button.dataset.oauth);
            } catch (error) {
              auth.showToast("Sign-in was cancelled. Please try again.");
            }
          });
        });
      })();
    </script>
  </body>
</html>
