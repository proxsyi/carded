<!doctype html>
<html lang="en">
  <head>
    <!-- Script order: config -> utils -> auth-guard -> auth -> supabase-db -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carded — Account</title>
    <meta name="description" content="Manage your Carded account, password, and study stats.">
    <meta name="theme-color" content="#1e1e2e">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/carded/assets/favicon.png">
    <link rel="apple-touch-icon" href="/carded/assets/apple-touch-icon.png">
    <link rel="manifest" href="/carded/manifest.webmanifest">
    <link rel="stylesheet" href="/carded/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/carded/config.js" defer></script>
    <script src="/carded/utils.js" defer></script>
    <script src="/carded/auth-guard.js" defer></script>
    <script src="/carded/auth.js" defer></script>
    <script src="/carded/supabase-db.js" defer></script>
  </head>
  <body>
    <main class="auth-shell" id="main">
      <section class="auth-card account-card">
        <div class="auth-header-row">
          <div>
            <p class="eyebrow">Carded</p>
            <h1>Account</h1>
          </div>
          <a class="ghost-button" href="/carded/library">Back to library</a>
        </div>

        <section id="account-view" class="stack hidden">
          <div class="panel account-summary">
            <div class="field">
              <span class="meta-label">Email</span>
              <strong id="account-email">-</strong>
            </div>
            <div class="field">
              <span class="meta-label">Account created</span>
              <strong id="account-created">-</strong>
            </div>
          </div>

          <section class="stack">
            <div class="section-header">
              <div class="stack">
                <h2 class="section-title">Usage stats</h2>
              </div>
            </div>
            <div class="summary-grid">
              <div class="stat-card"><div class="meta-label">Study time</div><div id="stats-time" class="stat-value">0m</div></div>
              <div class="stat-card"><div class="meta-label">Cards reviewed</div><div id="stats-reviewed" class="stat-value">0</div></div>
              <div class="stat-card"><div class="meta-label">Sessions</div><div id="stats-sessions" class="stat-value">0</div></div>
              <div class="stat-card"><div class="meta-label">Current streak</div><div id="stats-current-streak" class="stat-value">0</div></div>
              <div class="stat-card"><div class="meta-label">Longest streak</div><div id="stats-longest-streak" class="stat-value">0</div></div>
            </div>
          </section>

          <form id="password-form" class="stack panel">
            <h2>Change password</h2>
            <div class="field">
              <label for="new-password">New password</label>
              <input id="new-password" name="newPassword" class="input" type="password" minlength="6" required>
            </div>
            <div class="field">
              <label for="confirm-password">Confirm password</label>
              <input id="confirm-password" name="confirmPassword" class="input" type="password" minlength="6" required>
            </div>
            <button class="button" type="submit">Update password</button>
          </form>

          <div class="account-actions">
            <button id="signout-button" class="ghost-button" type="button">Sign out</button>
            <button id="delete-account-button" class="danger-button" type="button">Delete account</button>
          </div>
        </section>

        <section id="recovery-view" class="stack hidden">
          <p class="eyebrow">Password recovery</p>
          <h1>Set a new password</h1>
          <form id="recovery-form" class="stack panel">
            <div class="field">
              <label for="recovery-password">New password</label>
              <input id="recovery-password" name="newPassword" class="input" type="password" minlength="6" required>
            </div>
            <div class="field">
              <label for="recovery-confirm-password">Confirm password</label>
              <input id="recovery-confirm-password" name="confirmPassword" class="input" type="password" minlength="6" required>
            </div>
            <button class="button" type="submit">Set new password</button>
          </form>
        </section>
      </section>
    </main>
    <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
    <div id="delete-modal" class="modal-backdrop hidden">
      <div class="modal">
        <h2>Delete account?</h2>
        <p>This removes your Carded data from the cloud. This action cannot be undone.</p>
        <div class="modal__actions">
          <button id="cancel-delete-button" class="ghost-button" type="button">Cancel</button>
          <button id="confirm-delete-button" class="danger-button" type="button">Delete account</button>
        </div>
      </div>
    </div>
    <script defer>
      document.addEventListener("DOMContentLoaded", async function () {
        const session = await window.CardedAuthGuard.guardPage({ requiresAuth: true });
        if (!session) return;

        const accountView = document.getElementById("account-view");
        const recoveryView = document.getElementById("recovery-view");
        const deleteModal = document.getElementById("delete-modal");

        function formatDate(value) {
          return value ? new Date(value).toLocaleDateString() : "-";
        }

        function formatStudyTime(totalSeconds) {
          return Math.floor((Number(totalSeconds) || 0) / 60) + "m";
        }

        function toggleRecoveryMode(enabled) {
          accountView.classList.toggle("hidden", enabled);
          recoveryView.classList.toggle("hidden", !enabled);
        }

        toggleRecoveryMode(window.CardedAuth.isPasswordRecoveryMode());
        accountView.classList.remove("hidden");
        document.getElementById("account-email").textContent = session.user.email || "-";
        document.getElementById("account-created").textContent = formatDate(session.user.created_at);

        try {
          const stats = await window.CardedSupabaseDB.getOrCreateStats(session.user.id);
          document.getElementById("stats-time").textContent = formatStudyTime(stats.total_study_time);
          document.getElementById("stats-reviewed").textContent = String(stats.total_cards_reviewed || 0);
          document.getElementById("stats-sessions").textContent = String(stats.total_sessions || 0);
          document.getElementById("stats-current-streak").textContent = String(stats.current_streak || 0);
          document.getElementById("stats-longest-streak").textContent = String(stats.longest_streak || 0);
        } catch (error) {
          window.CardedAuth.showToast("Something went wrong. Please try again.");
        }

        async function handlePasswordUpdate(form) {
          const data = new FormData(form);
          const password = String(data.get("newPassword") || "");
          const confirmPassword = String(data.get("confirmPassword") || "");
          if (password !== confirmPassword) {
            window.CardedAuth.showToast("Passwords do not match.");
            return;
          }
          try {
            await window.CardedAuth.updatePassword(password);
            form.reset();
            toggleRecoveryMode(false);
            accountView.classList.remove("hidden");
            window.history.replaceState(null, "", window.location.pathname);
            window.CardedAuth.showToast("Password updated.");
          } catch (error) {
            window.CardedAuth.showToast(error.message || "Something went wrong. Please try again.");
          }
        }

        document.getElementById("password-form").addEventListener("submit", function (event) {
          event.preventDefault();
          handlePasswordUpdate(event.currentTarget);
        });

        document.getElementById("recovery-form").addEventListener("submit", function (event) {
          event.preventDefault();
          handlePasswordUpdate(event.currentTarget);
        });

        document.getElementById("signout-button").addEventListener("click", async function () {
          try {
            await window.CardedAuth.signOut();
            window.CardedUtils.redirectTo(window.BASE_PATH + "/login", null, true);
          } catch (error) {
            window.CardedAuth.showToast(error.message || "Something went wrong. Please try again.");
          }
        });

        document.getElementById("delete-account-button").addEventListener("click", function () {
          deleteModal.classList.remove("hidden");
        });

        document.getElementById("cancel-delete-button").addEventListener("click", function () {
          deleteModal.classList.add("hidden");
        });

        document.getElementById("confirm-delete-button").addEventListener("click", async function () {
          try {
            const response = await window.supabaseClient.rpc("delete_user");
            if (response.error) throw response.error;
            await window.CardedAuth.signOut();
            window.CardedUtils.redirectTo(window.BASE_PATH, null, true);
          } catch (error) {
            window.CardedAuth.showToast(error.message || "Something went wrong. Please try again.");
          } finally {
            deleteModal.classList.add("hidden");
          }
        });
      });
    </script>
  </body>
</html>
