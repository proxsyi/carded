<!doctype html>
<html lang="en">
  <head>
    <!-- Script order: config -> utils -> auth-guard -> db -> auth -> supabase-db -> sync -> app -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carded — Library</title>
    <meta name="description" content="Browse your Carded library of folders, sets, and flashcards.">
    <meta name="theme-color" content="#1e1e2e">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/carded/assets/favicon.png">
    <link rel="apple-touch-icon" href="/carded/assets/apple-touch-icon.png">
    <link rel="manifest" href="/carded/manifest.webmanifest">
    <link rel="stylesheet" href="/carded/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/dexie@4/dist/dexie.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/carded/config.js" defer></script>
    <script src="/carded/utils.js" defer></script>
    <script src="/carded/auth-guard.js" defer></script>
    <script src="/carded/db.js" defer></script>
    <script src="/carded/auth.js" defer></script>
    <script src="/carded/supabase-db.js" defer></script>
    <script src="/carded/sync.js" defer></script>
    <script src="/carded/app.js" defer></script>
  </head>
  <body>
    <div id="auth-loading" class="auth-loading">
      <div class="auth-loading__spinner" aria-hidden="true"></div>
      <p>Signing you in...</p>
    </div>
    <div id="install-banner" class="install-banner hidden">
      <p>Install Carded for offline access.</p>
      <button id="install-button" class="button" type="button">Install</button>
    </div>
    <div id="storage-error" class="storage-error hidden" role="alertdialog" aria-labelledby="storage-error-title" aria-describedby="storage-error-copy">
      <div class="storage-error__panel">
        <p class="eyebrow">Carded</p>
        <h1 id="storage-error-title">Storage is unavailable</h1>
        <p id="storage-error-copy">Carded needs browser storage to save your cards. Try using a regular browser window.</p>
      </div>
    </div>
    <div id="app-shell" class="app-shell hidden">
      <header class="topbar">
        <div class="topbar__brand">
          <a href="/carded/library" class="brand-link" aria-label="Go to library">
            <span class="brand-mark" aria-hidden="true">🃏</span>
            <span class="brand-text">Carded</span>
          </a>
        </div>
        <div class="topbar__actions" id="header-actions"></div>
      </header>
      <main id="app" class="page"></main>
    </div>
    <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <script defer>
      document.addEventListener("DOMContentLoaded", async function () {
        await window.CardedAuthGuard.guardPage({ requiresAuth: true });
        var deferredPrompt = null;
        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          deferredPrompt = event;
          var count = Number(window.CardedUtils.safeGet("carded_install_prompt_count") || 0) + 1;
          window.CardedUtils.safeSet("carded_install_prompt_count", String(count));
          if (count > 1 && !window.CardedUtils.safeGet("carded_install_prompt_dismissed")) {
            document.getElementById("install-banner").classList.remove("hidden");
          }
        });
        document.getElementById("install-button").addEventListener("click", async function () {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          await deferredPrompt.userChoice.catch(function () {
            return null;
          });
          window.CardedUtils.safeSet("carded_install_prompt_dismissed", "1");
          document.getElementById("install-banner").classList.add("hidden");
          deferredPrompt = null;
        });
      });
    </script>
  </body>
</html>
