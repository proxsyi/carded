<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141417">
    <title>Sign In · Carded</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./auth.js"></script>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Carded</p>
        <h1>Sign in</h1>
        <p class="auth-copy">Pick up your flashcards on any device.</p>

        <form id="signin-form" class="stack">
          <div class="field">
            <label for="signin-email">Email</label>
            <input id="signin-email" name="email" class="input" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="signin-password">Password</label>
            <input id="signin-password" name="password" class="input" type="password" autocomplete="current-password" required>
          </div>
          <button id="signin-submit" class="button" type="submit">Sign in</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <div class="stack">
          <button class="ghost-button auth-button" data-oauth="google" type="button">Sign in with Google</button>
          <button class="ghost-button auth-button" data-oauth="github" type="button">Sign in with GitHub</button>
        </div>

        <div class="auth-footer">
          <button id="forgot-password-toggle" class="link-button" type="button">Forgot password?</button>
          <p>Need an account? <a href="./signup.html">Sign up</a></p>
        </div>

        <form id="reset-form" class="stack hidden">
          <div class="field">
            <label for="reset-email">Reset email</label>
            <input id="reset-email" name="resetEmail" class="input" type="email" autocomplete="email">
          </div>
          <button class="ghost-button" type="submit">Send reset link</button>
        </form>
      </section>
    </main>

    <div id="toast-root" class="toast-root" aria-live="assertive" aria-atomic="true"></div>

    <script>
      (function () {
        const auth = window.CardedAuth;
        const signInForm = document.getElementById("signin-form");
        const resetForm = document.getElementById("reset-form");
        const toggle = document.getElementById("forgot-password-toggle");

        function readOAuthError() {
          const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
          const params = new URLSearchParams(hash);
          const queryParams = new URLSearchParams(window.location.search);
          return params.get("error_description") || params.get("error") || queryParams.get("error_description") || queryParams.get("error");
        }

        window.addEventListener("DOMContentLoaded", async function () {
          const oauthError = readOAuthError();
          if (oauthError) {
            auth.showToast(oauthError.includes("cancel") ? "Sign-in was cancelled. Please try again." : oauthError);
          }

          const session = await auth.getSession().catch(() => null);
          if (session) {
            auth.redirectToIndex();
          }
        });

        signInForm.addEventListener("submit", async function (event) {
          event.preventDefault();
          const formData = new FormData(signInForm);
          const email = String(formData.get("email") || "").trim();
          const password = String(formData.get("password") || "");

          try {
            await auth.signInWithEmail(email, password);
          } catch (error) {
            auth.showToast(error.message || "Something went wrong. Please try again.");
          }
        });

        resetForm.addEventListener("submit", async function (event) {
          event.preventDefault();
          const formData = new FormData(resetForm);
          const email = String(formData.get("resetEmail") || "").trim();

          if (!email) {
            auth.showToast("Enter your email address first.");
            return;
          }

          try {
            await auth.resetPassword(email);
            auth.showToast("Password reset link sent.");
          } catch (error) {
            auth.showToast(error.message || "Something went wrong. Please try again.");
          }
        });

        document.querySelectorAll("[data-oauth]").forEach(function (button) {
          button.addEventListener("click", async function () {
            try {
              await auth.signInWithOAuth(button.dataset.oauth);
            } catch (error) {
              auth.showToast("Sign-in was cancelled. Please try again.");
            }
          });
        });

        toggle.addEventListener("click", function () {
          resetForm.classList.toggle("hidden");
          const input = document.getElementById("reset-email");
          if (!resetForm.classList.contains("hidden")) {
            input.focus();
          }
        });
      })();
    </script>
  </body>
</html>
